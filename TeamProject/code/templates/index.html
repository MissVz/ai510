<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Input</title>
    <link rel="stylesheet" href="static/styles.css"> <!-- Link to external CSS file -->
</head>
<body>
    <div class="container">
        <h1>Enter Property Details</h1>
        <form action="/predict" method="post"> <!-- Form to submit feature values for prediction -->
            <!-- Input for number of bathrooms -->
            <label for="bathrooms">Number of Bathrooms:</label>
            <input type="number" id="bathrooms" name="bathrooms" min="0" max="10" step="0.5" required title="Enter the number of bathrooms (0-10)">
            
            <!-- Input for square footage of living space -->
            <label for="sqft_living">Living Area (Sq Ft):</label>
            <input type="number" id="sqft_living" name="sqft_living" min="200" max="20000" required title="Enter the square footage of living space (200-20000)">
            
            <!-- Input for square footage of the lot -->
            <label for="sqft_lot">Lot Size (Sq Ft):</label>
            <input type="number" id="sqft_lot" name="sqft_lot" min="400" max="2000000" required title="Enter the square footage of the lot (400-2000000)">
            
            <!-- Input for waterfront property indicator -->
            <label>Waterfront Property:</label>
            <div class="radio-group">
                <input type="radio" id="waterfront_yes" name="waterfront" value="1" required>
                <label for="waterfront_yes">Yes</label>
                <input type="radio" id="waterfront_no" name="waterfront" value="0" required>
                <label for="waterfront_no">No</label>
            </div>
            
            <!-- Input for view rating -->
            <label for="view">View Rating (0-10):</label>
            <input type="number" id="view" name="view" min="0" max="10" required title="Enter the view rating (0-10)">
            
            <!-- Input for condition rating -->
            <label for="condition">Condition Rating (1-10):</label>
            <input type="number" id="condition" name="condition" min="1" max="10" required title="Enter the condition rating (1-10)">
            
            <!-- Input for grade rating -->
            <label for="grade">Grade Rating (1-20):</label>
            <input type="number" id="grade" name="grade" min="1" max="20" required title="Enter the grade rating (1-20)">
            
            <!-- Input for square footage above ground -->
            <label for="sqft_above">Above Ground Area (Sq Ft):</label>
            <input type="number" id="sqft_above" name="sqft_above" min="200" max="10000" required title="Enter the square footage above ground (200-10000)">
            
            <!-- Input for square footage of the basement -->
            <label for="sqft_basement">Basement Area (Sq Ft):</label>
            <input type="number" id="sqft_basement" name="sqft_basement" min="0" max="5000" required title="Enter the square footage of the basement (0-5000)">
            
            <!-- Input for year the property was built -->
            <label for="yr_built">Year Built:</label>
            <input type="number" id="yr_built" name="yr_built" min="1500" max="3000" required title="Enter the year the property was built (1500-3000)">
            
            <!-- Input for year the property was renovated -->
            <label for="yr_renovated">Year Renovated:</label>
            <input type="number" id="yr_renovated" name="yr_renovated" min="0" max="3000" title="Enter the year the property was renovated (0-3000)">
            
            <!-- Input for zipcode -->
            <label for="zipcode">Zip Code:</label>
            <input type="number" id="zipcode" name="zipcode" min="98000" max="98200" required title="Enter the zip code (98000-98200)">
            
            <!-- Input for latitude -->
            <label for="lat">Latitude:</label>
            <input type="number" id="lat" name="lat" min="46.1" max="48.1" step="0.000001" required title="Enter the latitude (46.1-48.1)">
            
            <!-- Input for longitude -->
            <label for="long">Longitude:</label>
            <input type="number" id="long" name="long" min="-122.1" max="-119.1" step="0.000001" required title="Enter the longitude (-122.1 to -119.1)">
            
            <!-- Input for square footage of living space for the nearest 15 neighbors -->
            <label for="sqft_living15">Living Area of 15 Nearest Neighbors (Sq Ft):</label>
            <input type="number" id="sqft_living15" name="sqft_living15" min="300" max="7000" required title="Enter the square footage of living space for the nearest 15 neighbors (300-7000)">
            
            <!-- Input for square footage of the lot for the nearest 15 neighbors -->
            <label for="sqft_lot15">Lot Size of 15 Nearest Neighbors (Sq Ft):</label>
            <input type="number" id="sqft_lot15" name="sqft_lot15" min="500" max="900000" required title="Enter the square footage of the lot for the nearest 15 neighbors (500-900000)">
            
            <br><br> <!-- Added space here -->
            <input type="submit" value="Submit"> <!-- Submit button -->
        </form>
    </div>
</body>
</html>
